# Incluído em todo `location`: o nginx descarta os add_header herdados do nível acima quando o
# bloco define algum, então os cabeçalhos de segurança são repetidos via include.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
