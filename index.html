<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FTech Finance</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- Configuração de runtime (spec 0003): script clássico, antes do módulo da aplicação. -->
        <script src="/config.js"></script>
        <!-- Aplica o tema guardado antes da primeira pintura (spec 0004). -->
        <script>
            try {
                var t = localStorage.getItem('ftech.tema');
                if (t === 'escuro' || t === 'claro') document.documentElement.dataset.tema = t;
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
