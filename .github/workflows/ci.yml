name: ci

# O CI apenas invoca o orquestrador único de gates (spec 0002, INV-0002-03).
# Nunca adicione aqui um comando de verificação que não esteja em scripts/check.mjs.

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop]

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Navegador do gate e2e (spec 0002): sem ele o gate seria SKIP (ambiente).
            # O --with-deps usa o apt do runner; um espelho do Ubuntu fora do ar já prendeu este
            # passo por 15 minutos. O limite faz a falha aparecer cedo — rode o job de novo.
            - name: Install Playwright Chromium
              timeout-minutes: 8
              run: npx playwright install --with-deps chromium

            # Desde o scaffold (T-0003-01) o CI roda em modo estrito: --require-tools
            # converte todo SKIP em falha (INV-0002-05, INV-0003-04).
            - name: Quality gates
              run: npm run check -- --require-tools
