<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FTech Finance</title>
        <!-- Configuração de runtime (spec 0003): script clássico, antes do módulo da aplicação. -->
        <script src="/config.js"></script>
        <!-- Aplica o tema guardado antes da primeira pintura (spec 0004). -->
        <script>
            try {
                var t = localStorage.getItem('ftech.tema');
                if (t === 'escuro' || t === 'claro') document.documentElement.dataset.tema = t;
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
