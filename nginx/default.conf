# nginx do frontend (spec 0007). Sem proxy: o ingress encaminha /api ao backend.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Arquivos com hash: imutáveis. Inexistente é 404, nunca o index.html (ERR-0007-03).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Sem `always`: o 404 não leva o cache imutável (não pode ficar um ano em cache).
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vem do ConfigMap; 404 se não estiver montado (ERR-0007-01).
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Alvo das probes.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok";
    }

    # Fallback da SPA (ERR-0007-02).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
